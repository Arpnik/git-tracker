
name: Track Dev Stats

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Prevent simultaneous runs from pushing to main.
concurrency:
  group: dev-stats-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect stats
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          DAYS_LOOKBACK: '1095'
          # INCLUDE_ORGS: 'altconvey,GetKnowbie'
          # EXCLUDE_REPOS: 'someone/huge-repo'
        run: python scripts/collect_stats.py

      - name: Commit results
        run: |
          git config user.name "dev-stats-bot"
          git config user.email "dev-stats-bot@users.noreply.github.com"

          git add data/ assets/ index.html README.md README_STATS.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update dev stats [skip ci]"

          # Fetch latest remote changes and replay our commit on top.
          git fetch origin main
          git rebase origin/main

          # Push updated history.
          git push origin main

      # Mirror the generated README + charts to the profile repo (<user>/<user>)
      # so it shows on https://github.com/<user>. Skips if the repo doesn't exist.
      - name: Publish profile README
        env:
          STATS_PAT: ${{ secrets.STATS_PAT }}
          PROFILE_REPO: ${{ vars.PROFILE_REPO || format('{0}/{0}', github.repository_owner) }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${STATS_PAT}@github.com/${PROFILE_REPO}.git" profile-repo 2>/dev/null; then
            echo "::warning::Profile repo ${PROFILE_REPO} not found or not accessible; skipping."
            exit 0
          fi
          cp README.md profile-repo/README.md
          rm -rf profile-repo/assets && cp -r assets profile-repo/assets
          cd profile-repo
          git config user.name "dev-stats-bot"
          git config user.email "dev-stats-bot@users.noreply.github.com"
          git add README.md assets
          if git diff --staged --quiet; then echo "Profile already up to date."; exit 0; fi
          git commit -m "chore: refresh profile from git-tracker"
          git push
